name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Swift package + example app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pinned so a runner image update can't silently change the compiler.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Package tests
        run: swift test

      # Data-race safety is an error in Swift 6 language mode.
      - name: Library in Swift 6 mode
        run: swift build -Xswiftc -swift-version -Xswiftc 6

      # The README's call sites, written from the main actor in Swift 6.
      - name: Swift 6 callers
        run: swift build --package-path Tests/ConcurrencyCheck

      # The example app uses iOS 26's Liquid Glass behind availability
      # checks, so it needs the iOS 26 SDK. The package above stays on 16.4,
      # its toolchain floor. Pinned like 16.4; the listing shows what else
      # the image has when this one goes.
      - name: Select Xcode for the example app
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      # Unsigned simulator build: proves the example compiles against this
      # revision of the package without any signing identity.
      - name: Example app (Simulator)
        run: >
          xcodebuild build
          -project Examples/SplatCapture/SplatCapture.xcodeproj
          -scheme SplatCapture
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

      # The same, for devices: links SplatKit's iphoneos binaries, which the
      # simulator build never touches.
      - name: Example app (device)
        run: >
          xcodebuild build
          -project Examples/SplatCapture/SplatCapture.xcodeproj
          -scheme SplatCapture
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

      # What TestFlight gets: Release for devices, unsigned.
      - name: Example app (device, Release)
        run: >
          xcodebuild build
          -project Examples/SplatCapture/SplatCapture.xcodeproj
          -scheme SplatCapture
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/release"
          CODE_SIGNING_ALLOWED=NO

      # The state previews are Debug only (#if DEBUG in PreviewHarness.swift).
      - name: Release leaves out the previews
        run: |
          binary="$RUNNER_TEMP/release/Build/Products/Release-iphoneos/SplatCapture.app/SplatCapture"
          test -f "$binary"
          if grep -q SplatPreviewState "$binary"; then
            echo "::error::The Release binary contains SplatPreviewState"
            exit 1
          fi
